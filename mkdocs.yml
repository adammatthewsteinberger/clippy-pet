site_name: Clippy Pet
site_url: https://adammatthewsteinberger.github.io/clippy-pet/
site_description: >-
  An unofficial animated paperclip pet for the ChatGPT desktop app and Codex CLI.
  Nine animation states, sixteen look directions, one-line install on every Unix.
site_author: Adam Matthew Steinberger
repo_url: https://github.com/adammatthewsteinberger/clippy-pet
repo_name: adammatthewsteinberger/clippy-pet
edit_uri: edit/develop/docs/
copyright: >-
  Copyright &copy; 2026 <a href="https://adammatthewsteinberger.github.io/clippy-pet/project/author/">Adam Matthew Steinberger</a>
  &middot; <a href="https://adammatthewsteinberger.github.io/clippy-pet/project/license/">MIT License</a>
  &middot; Unofficial: not affiliated with or endorsed by Microsoft or OpenAI

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
    annotation: material/paperclip
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  analytics:
    provider: custom
    goatcounter_code: "adam-matthew-steinberger"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adammatthewsteinberger/clippy-pet
      name: Clippy Pet on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/adammatthewsteinberger/
      name: Adam on LinkedIn
    - icon: material/web
      link: https://vibewithadam.matthewsteinberger.com
      name: Adam's site
    - icon: material/rss-box
      link: feed_rss_created.xml
      name: RSS feed

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - social:
      cards_layout_options:
        background_color: "#1c2434"
        color: "#f5f7fa"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      auto_caption: false
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: required
      archive: true
      categories: true
      pagination_per_page: 10
      draft: false
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - redirects:
      redirect_maps:
        INSTALL.md: get-started/install.md
        PACKAGING.md: project/packaging.md
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Install: get-started/install.md
      - Pick it in ChatGPT & Codex: get-started/select.md
      - Troubleshooting: get-started/troubleshooting.md
      - Uninstall & migrate: get-started/uninstall.md
  - Installers & packages:
      - packages/index.md
      - One-line install & tarballs: packages/curl.md
      - macOS: packages/macos.md
      - Linux: packages/linux.md
      - Package managers: packages/managers.md
      - Verify downloads: packages/verify.md
  - Meet Clippy Pet:
      - meet/index.md
      - The nine animations: meet/animations.md
      - Sixteen look directions: meet/look-directions.md
      - The paperclip story: meet/history.md
      - Design notes: meet/design.md
  - How it works:
      - how-it-works/index.md
      - The pet contract: how-it-works/contract.md
      - QA evidence (the receipts): how-it-works/qa.md
      - Repository layout: how-it-works/repository.md
  - Make your own:
      - make/index.md
      - Submit a variant: make/submit.md
  - Blog:
      - blog/index.md
  - Community:
      - community/index.md
      - Contributing: community/contributing.md
      - Show and tell: community/show-and-tell.md
      - Support: community/support.md
      - Security: community/security.md
      - Code of conduct: community/code-of-conduct.md
      - Governance: community/governance.md
  - Project:
      - project/index.md
      - Changelog: project/changelog.md
      - Roadmap: project/roadmap.md
      - Packaging runbook: project/packaging.md
      - License & notice: project/license.md
      - Cite this project: project/citation.md
      - About the author: project/author.md
