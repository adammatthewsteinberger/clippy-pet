version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    labels: [dependencies, documentation]
    groups:
      mkdocs:
        patterns: ["mkdocs*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
