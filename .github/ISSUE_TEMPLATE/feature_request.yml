name: Feature request
description: Suggest a compatible improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Asset rights
      options:
        - label: I will only submit assets I can license under MIT.
          required: true
