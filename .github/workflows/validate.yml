name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate.py
      - name: Reject local paths and generation cache IDs
        run: |
          private_pattern='/''Users/|Documents/''Codex|generated_''images|019f''fcc'
          if grep -RIE "$private_pattern" --exclude='*.png' --exclude='*.webp' --exclude='*.gif' .; then
            exit 1
          fi
